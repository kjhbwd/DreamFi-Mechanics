<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream-Fi #03: 조향 장치</title>
    <style>
        /* [전역 스타일] 드림파이 다크 모드 */
        :root { --brand-gold: #ffcc00; --bg-dark: #121212; --panel-bg: #1e1e1e; }
        body { 
            background: var(--bg-dark); 
            color: white; 
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif; 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* 상단 헤더 */
        header { 
            height: 60px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-bottom: 1px solid #333; 
            background: #111;
            z-index: 10;
        }
        .brand-title { color: var(--brand-gold); font-weight: 800; letter-spacing: 1px; font-size: 1.2rem; }

        /* 메인 컨테이너 (50:50 분할) */
        .main-container { 
            display: flex; 
            flex: 1; 
            height: calc(100vh - 60px); 
        }

        /* [왼쪽 패널] 전체 맵 */
        .left-panel { 
            flex: 1; 
            background: radial-gradient(circle at center, #2a2a2a, #121212); 
            border-right: 1px solid #333; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative;
        }
        .panel-label { 
            position: absolute; top: 20px; left: 20px; 
            color: #555; font-size: 0.8rem; font-weight: bold; border: 1px solid #555; padding: 5px 10px; border-radius: 5px; 
        }

        /* [오른쪽 패널] 시뮬레이터 */
        .right-panel { 
            flex: 1; 
            background: var(--panel-bg); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
        }

        canvas { max-width: 100%; max-height: 100%; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }

        /* 컨트롤러 UI */
        .controls-box { width: 80%; text-align: center; margin-top: 20px; }
        input[type=range] { width: 100%; accent-color: var(--brand-gold); cursor: pointer; height: 8px; border-radius: 5px; }
        
        .info-btn { 
            background: var(--brand-gold); color: #000; border: none; 
            padding: 10px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; 
            margin-bottom: 20px; transition: 0.3s; 
        }
        .info-btn:hover { background: white; transform: scale(1.05); }

        /* 반응형 */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; overflow-y: auto; }
            .left-panel { flex: 0.8; min-height: 250px; border-right: none; border-bottom: 1px solid #333; }
            .right-panel { flex: 1.2; }
            body { overflow: auto; }
        }

        /* [업그레이드된 팝업창 스타일] */
        #info-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: #222; border: 2px solid var(--brand-gold); padding: 30px; border-radius: 20px; width: 320px; text-align: center; box-shadow: 0 0 30px rgba(255,204,0,0.2); }
        
        .role-box { text-align: left; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        .role-title { font-weight: bold; margin-bottom: 5px; display: block; }
        
        .nav-back { position: absolute; bottom: 20px; right: 20px; color: #666; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div id="info-modal">
        <div class="modal-content">
            <h3 style="color:var(--brand-gold); margin-top:0; font-size:1.4rem;">랙 & 피니언의 비밀 🤫</h3>
            
            <div class="role-box">
                <span class="role-title" style="color: #ffcc00;">🟡 피니언 (회전 대장)</span>
                <span style="color:#ccc; font-size:0.9rem;">핸들 끝에 달린 작은 기어예요.<br>핸들을 돌리면 <b>제자리에서 뱅글뱅글</b> 돌아요!</span>
            </div>

            <div class="role-box">
                <span class="role-title" style="color: #ccc;">➖ 랙 (직선 대장)</span>
                <span style="color:#ccc; font-size:0.9rem;">바퀴를 잡고 있는 긴 팔이에요.<br>피니언이 툭툭 밀어주면 <b>옆으로 쭉쭉</b> 움직여요.</span>
            </div>

            <p style="color:#fff; font-weight:bold; margin: 20px 0;">
                "회전 운동(핸들)을 ➡️ 직선 운동(바퀴)으로!"
            </p>

            <button onclick="toggleModal()" style="background:#444; color:#fff; border:none; padding:10px 30px; border-radius:8px; cursor:pointer; font-weight:bold;">이해했어요! 👌</button>
        </div>
    </div>

    <header>
        <div class="brand-title">DREAM-FI MECHANICS #03</div>
    </header>

    <div class="main-container">
        <div class="left-panel">
            <div class="panel-label">📍 CAR DIAGNOSTIC MAP</div>
            <canvas id="mapCanvas" width="300" height="400"></canvas>
            <div style="color:#666; font-size:0.8rem; margin-top:10px;">▲ 현재 작동 부위: <span style="color:var(--brand-gold);">전륜 조향축</span></div>
        </div>

        <div class="right-panel">
            <button class="info-btn" onclick="toggleModal()">💡 원리 설명 보기</button>
            <canvas id="simCanvas" width="340" height="250"></canvas>
            
            <div class="controls-box">
                <div style="color:#aaa; font-size:0.9rem; margin-bottom:10px;">핸들 조작 (Steering Wheel)</div>
                <input type="range" id="steerRange" min="-45" max="45" step="1" value="0">
                <div id="angleText" style="color:var(--brand-gold); font-weight:bold; margin-top:5px;">0°</div>
            </div>
            
            <a href="../index.html" class="nav-back">← 목차로</a>
        </div>
    </div>

    <script>
        /* 변수 설정 */
        const steerRange = document.getElementById('steerRange');
        const angleText = document.getElementById('angleText');
        let currentAngle = 0;

        /* 1. 왼쪽 맵 (Context) */
        const mapCanvas = document.getElementById('mapCanvas');
        const mapCtx = mapCanvas.getContext('2d');

        function drawMap() {
            mapCtx.clearRect(0, 0, mapCanvas.width, mapCanvas.height);
            mapCtx.strokeStyle = "#444"; mapCtx.lineWidth = 3; mapCtx.strokeRect(100, 80, 100, 240); // 차체
            mapCtx.fillStyle = "#333"; mapCtx.fillRect(70, 260, 30, 50); mapCtx.fillRect(200, 260, 30, 50); // 뒷바퀴

            // 앞바퀴 회전
            function drawMapWheel(x, y) {
                mapCtx.save(); mapCtx.translate(x, y); mapCtx.rotate(currentAngle * Math.PI / 180);
                mapCtx.fillStyle = (Math.abs(currentAngle) > 0) ? "#00ff64" : "#555";
                mapCtx.shadowBlur = 10; mapCtx.shadowColor = (Math.abs(currentAngle) > 0) ? "#00ff64" : "transparent";
                mapCtx.fillRect(-15, -25, 30, 50); mapCtx.restore();
            }
            drawMapWheel(85, 100); drawMapWheel(215, 100);

            // 강조 박스
            mapCtx.shadowBlur = 0; mapCtx.beginPath(); mapCtx.strokeStyle = "#ffcc00"; mapCtx.lineWidth = 2; mapCtx.setLineDash([5, 5]);
            mapCtx.rect(50, 60, 200, 100); mapCtx.stroke(); mapCtx.setLineDash([]);
        }

        /* 2. 오른쪽 시뮬레이터 (Detail) */
        const simCanvas = document.getElementById('simCanvas');
        const simCtx = simCanvas.getContext('2d');

        function drawSim() {
            simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
            const cx = simCanvas.width / 2; const cy = 100;
            const rackMove = currentAngle * -0.8;

            // 바퀴 및 타이로드
            function drawDetailWheel(x, y, isLeft) {
                simCtx.save(); simCtx.translate(x, y); simCtx.rotate(currentAngle * Math.PI / 180);
                simCtx.fillStyle = "#222"; simCtx.beginPath(); simCtx.roundRect(-20, -40, 40, 80, 5); simCtx.fill(); // 타이어
                simCtx.strokeStyle = "#888"; simCtx.lineWidth=2; simCtx.strokeRect(-12, -30, 24, 60); // 휠
                simCtx.restore();

                simCtx.beginPath(); simCtx.strokeStyle = "#aaa"; simCtx.lineWidth = 4;
                simCtx.moveTo(x + (isLeft ? 20 : -20), y);
                simCtx.lineTo(cx + (isLeft ? -80 : 80) + rackMove, cy + 40); simCtx.stroke(); // 타이로드
                simCtx.fillStyle = "#ffcc00"; simCtx.beginPath(); simCtx.arc(x + (isLeft ? 20 : -20), y, 5, 0, Math.PI*2); simCtx.fill(); // 관절
            }
            drawDetailWheel(50, cy, true); drawDetailWheel(290, cy, false);

            // 랙 (직선 대장)
            simCtx.fillStyle = "#555"; simCtx.fillRect(cx - 100 + rackMove, cy + 35, 200, 15);
            simCtx.fillStyle = "#999"; 
            for(let i=0; i<15; i++) simCtx.fillRect(cx - 90 + rackMove + (i*12), cy + 35, 6, 8); // 톱니

            // 피니언 (회전 대장)
            simCtx.beginPath(); simCtx.arc(cx, cy + 42, 20, 0, Math.PI*2); simCtx.fillStyle = "rgba(255, 204, 0, 0.9)"; simCtx.fill();
            simCtx.save(); simCtx.translate(cx, cy + 42); simCtx.rotate(currentAngle * 2 * Math.PI / 180);
            simCtx.strokeStyle = "#000"; simCtx.lineWidth = 2; 
            simCtx.beginPath(); simCtx.moveTo(-20, 0); simCtx.lineTo(20, 0); simCtx.stroke();
            simCtx.beginPath(); simCtx.moveTo(0, -20); simCtx.lineTo(0, 20); simCtx.stroke(); simCtx.restore();

            // 라벨링
            simCtx.fillStyle = "#fff"; simCtx.font = "bold 12px sans-serif";
            simCtx.fillText("랙 (직선 운동)", cx + rackMove - 30, cy + 80);
            simCtx.fillStyle = "#ffcc00"; simCtx.fillText("피니언 (회전)", cx - 35, cy + 10);
        }

        function update() {
            currentAngle = parseInt(steerRange.value);
            angleText.innerText = currentAngle + "°";
            drawMap(); drawSim();
            requestAnimationFrame(update);
        }

        steerRange.addEventListener('input', update);
        function toggleModal() {
            const modal = document.getElementById('info-modal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        }
        update();
    </script>
</body>
</html>
