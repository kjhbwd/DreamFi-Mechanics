<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamFi #02: 변속기 원리</title>
    <style>
        body { background: #121212; color: #eee; font-family: 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .header h1 { color: #ffcc00; margin-bottom: 5px; }
        #easy-guide { width: 320px; min-height: 80px; background: rgba(255, 204, 0, 0.1); border: 2px solid #ffcc00; border-radius: 15px; margin-bottom: 20px; padding: 15px; text-align: center; font-size: 1.1rem; color: #ffcc00; font-weight: bold; }
        
        /* 에너지 원리 버튼 */
        #info-btn { margin-bottom: 10px; background: #ffcc00; color: #000; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        
        #info-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 280px; background: #222; border: 3px solid #ffcc00; padding: 20px; border-radius: 20px; z-index: 100; text-align: center; box-shadow: 0 0 50px rgba(0,0,0,0.9); }

        #canvas-container { background: #1e1e1e; border: 4px solid #333; border-radius: 25px; padding: 20px; }
        .btn-group { margin-top: 20px; display: flex; gap: 10px; }
        button.gear-btn { background: #333; color: white; border: 2px solid #555; padding: 12px 15px; cursor: pointer; border-radius: 10px; font-weight: bold; }
        button.active { background: #ffcc00; color: black; border-color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Vibe Engineering #02</h1>
    </div>

    <button id="info-btn" onclick="toggleModal()">💡 에너지 활용 원리 보기</button>

    <div id="easy-guide">자전거 기어를 바꿔볼까요?</div>

    <div id="canvas-container">
        <div id="info-modal">
            <h3 style="color:#ffcc00; margin-top:0;">힘과 속도의 마법! 🪄</h3>
            <p style="font-size: 0.9rem; line-height: 1.6;">
                1. <b>1단:</b> 엔진은 빨리 돌아도 바퀴는 천천히 돌아요. 대신 <b>엄청난 힘</b>이 생겨서 언덕도 잘 올라가요!<br><br>
                2. <b>3단:</b> 엔진이 조금만 돌아도 바퀴가 <b>쌩쌩 빠르게</b> 돌아요! 고속도로에서 사용하죠.
            </p>
            <button onclick="toggleModal()" style="background:#444; color:#fff; border:none; padding:5px 15px; border-radius:10px; cursor:pointer;">닫기</button>
        </div>
        <canvas id="gearCanvas" width="320" height="200"></canvas>
    </div>

    <div class="btn-group">
        <button onclick="setGear(1)" id="gear1" class="gear-btn active">1단 (힘차게!)</button>
        <button onclick="setGear(2)" id="gear2" class="gear-btn">2단 (중간)</button>
        <button onclick="setGear(3)" id="gear3" class="gear-btn">3단 (쌩쌩~)</button>
    </div>

    <script>
        function toggleModal() {
            const modal = document.getElementById('info-modal');
            modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
        }

        const canvas = document.getElementById('gearCanvas');
        const ctx = canvas.getContext('2d');
        const easyGuide = document.getElementById('easy-guide');

        let engineAngle = 0;
        let wheelAngle = 0;
        let currentGear = 1;

        const gearData = {
            1: { ratio: 0.5, desc: "1단: 오르막길 영차영차!<br>힘이 제일 세요!", color: "#00ff64" },
            2: { ratio: 1.0, desc: "2단: 평지에서 평범하게~<br>적당한 속도로 가요!", color: "#0096ff" },
            3: { ratio: 2.0, desc: "3단: 고속도로 쌩쌩~!<br>바퀴가 엄청 빨라요!", color: "#ff6400" }
        };

        function setGear(g) {
            currentGear = g;
            easyGuide.innerHTML = gearData[g].desc;
            document.querySelectorAll('.gear-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('gear' + g).classList.add('active');
        }

        function drawGear(x, y, radius, angle, color, teeth) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.fillStyle = color;
            for (let i = 0; i < teeth; i++) {
                ctx.rotate(Math.PI * 2 / teeth);
                ctx.fillRect(radius - 5, -5, 12, 10);
            }
            ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            engineAngle += 0.05;
            wheelAngle += 0.05 * gearData[currentGear].ratio;

            // 엔진 쪽 기어
            drawGear(80, 100, 30, engineAngle, "#888", 10);
            ctx.fillStyle = "#888"; ctx.fillText("엔진의 힘", 55, 160);

            // 바퀴 쪽 기어
            const wheelSize = 30 * (1.5 / gearData[currentGear].ratio);
            drawGear(220, 100, wheelSize, -wheelAngle, gearData[currentGear].color, 16);
            ctx.fillStyle = gearData[currentGear].color; ctx.fillText("바퀴의 속도", 195, 100 + wheelSize + 30);

            requestAnimationFrame(animate);
        }
        setGear(1); animate();
    </script>
</body>
</html>
