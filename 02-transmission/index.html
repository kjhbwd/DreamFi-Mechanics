<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamFi #02: 기어의 비밀</title>
    <style>
        body { background: #121212; color: #eee; font-family: 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        #easy-guide { width: 340px; min-height: 80px; background: rgba(255, 204, 0, 0.1); border: 2px solid #ffcc00; border-radius: 15px; margin-bottom: 15px; padding: 15px; text-align: center; font-size: 1.1rem; color: #ffcc00; font-weight: bold; line-height: 1.5; }
        #info-btn { margin-bottom: 10px; background: #ffcc00; color: #000; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        #canvas-container { position: relative; background: #1e1e1e; border: 4px solid #333; border-radius: 25px; padding: 10px; overflow: hidden; }
        #info-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 280px; background: #222; border: 3px solid #ffcc00; padding: 20px; border-radius: 20px; z-index: 100; box-shadow: 0 0 50px rgba(0,0,0,0.9); }
        .btn-group { margin-top: 20px; display: flex; gap: 10px; width: 340px; }
        .gear-btn { flex: 1; background: #333; color: white; border: 2px solid #555; padding: 12px 0; cursor: pointer; border-radius: 12px; font-weight: bold; }
        .active { background: #ffcc00; color: black; border-color: #fff; }
    </style>
</head>
<body>

    <h2 style="color:#ffcc00; margin-bottom:10px;">Vibe Engineering #02</h2>
    <button id="info-btn" onclick="toggleModal()">💡 거대 바퀴의 비밀 보기</button>
    <div id="easy-guide">1단은 왜 바퀴가 커질까요?</div>

    <div id="canvas-container">
        <div id="info-modal">
            <h3 style="color:#ffcc00; margin-top:0;">1단은 '힘센 거인'! 👹</h3>
            <p style="font-size: 0.85rem; line-height: 1.7; text-align: left;">
                무거운 차를 처음 밀 때는 <b>커다란 톱니바퀴</b>가 필요해요. 엔진이 10번 돌 때 바퀴를 1번만 돌리게 만들면, 에너지가 응축되어 엄청난 힘이 생기거든요!<br><br>
                그래서 1단은 바퀴가 <b>제일 크고 느리지만, 힘은 천하장사</b>랍니다!
            </p>
            <button onclick="toggleModal()" style="background:#444; color:#fff; border:none; padding:8px 20px; border-radius:10px; cursor:pointer;">이해했어요!</button>
        </div>
        <canvas id="gearCanvas" width="340" height="240"></canvas>
    </div>

    <div class="btn-group">
        <button onclick="setGear(1)" id="gear1" class="gear-btn active">1단 (영차!)</button>
        <button onclick="setGear(2)" id="gear2" class="gear-btn">2단 (적당히)</button>
        <button onclick="setGear(3)" id="gear3" class="gear-btn">3단 (쌩쌩~)</button>
    </div>

    <script>
        function toggleModal() {
            const modal = document.getElementById('info-modal');
            modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
        }

        const canvas = document.getElementById('gearCanvas');
        const ctx = canvas.getContext('2d');
        const easyGuide = document.getElementById('easy-guide');

        let engineAngle = 0;
        let wheelAngle = 0;
        let currentGear = 1;

        const gearData = {
            1: { ratio: 0.3, eColor: "#ff4400", wColor: "#00ff64", desc: "1단: 바퀴가 커졌죠? <br>무거운 차를 움직이는 '천하장사' 힘!" },
            2: { ratio: 1.0, eColor: "#ffcc00", wColor: "#0096ff", desc: "2단: 이제 속도를 좀 내볼까요? <br>적당한 힘과 속도!" },
            3: { ratio: 2.5, eColor: "#ffffff", wColor: "#ff6400", desc: "3단: 바퀴가 작아지며 빨라져요! <br>고속도로 쌩쌩 모드!" }
        };

        function setGear(g) {
            currentGear = g;
            easyGuide.innerHTML = gearData[g].desc;
            document.querySelectorAll('.gear-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('gear' + g).classList.add('active');
        }

        function drawGear(x, y, radius, angle, color, teeth, label) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.fillStyle = color;
            ctx.shadowBlur = 10; ctx.shadowColor = color;
            for (let i = 0; i < teeth; i++) {
                ctx.rotate(Math.PI * 2 / teeth);
                ctx.fillRect(radius - 5, -6, 12, 12);
            }
            ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();
            ctx.restore();

            ctx.shadowBlur = 0;
            ctx.fillStyle = color;
            ctx.font = "bold 13px sans-serif";
            // 글씨 위치를 기어 아래쪽에 고정
            ctx.fillText(label, x - 30, 220); 
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let speed = 0.04;
            engineAngle += speed * (currentGear === 1 ? 1.8 : 1);
            wheelAngle += speed * (currentGear === 1 ? 1.8 : 1) * gearData[currentGear].ratio;

            // 엔진 기어 크기 고정
            drawGear(80, 100, 25, engineAngle, gearData[currentGear].eColor, 10, "엔진 (동력)");

            // 바퀴 기어 크기 (화면 밖으로 안 나가게 비율 조정)
            const wheelSize = 25 * (0.8 / gearData[currentGear].ratio);
            drawGear(220, 100, wheelSize, -wheelAngle, gearData[currentGear].wColor, 18, "바퀴 (전달)");

            requestAnimationFrame(animate);
        }
        setGear(1); animate();
    </script>
</body>
</html>
