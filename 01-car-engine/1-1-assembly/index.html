<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream-Fi Assembly Protocol</title>
    <style>
        /* --- 전체 테마: 다크 테크니컬 --- */
        :root { --main-color: #ff4d4d; --bg-dark: #0a0a0a; --panel-color: #111; }
        body { margin: 0; background: var(--bg-dark); color: white; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* 헤더 */
        header { height: 60px; border-bottom: 2px solid #333; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; letter-spacing: 2px; color: var(--main-color); background: #000; z-index: 10; }

        /* 메인 레이아웃 */
        .container { display: flex; flex: 1; height: 100%; }
        
        /* 1. 왼쪽 패널 */
        .left-panel { width: 280px; background: var(--panel-color); border-right: 1px solid #333; padding: 20px; z-index: 5; }
        .panel-header { color: #888; border-bottom: 2px solid var(--main-color); padding-bottom: 10px; margin-bottom: 20px; font-weight: bold; }
        .part-list { display: flex; flex-direction: column; gap: 15px; }
        .list-item { padding: 15px; background: #222; border-radius: 8px; border: 1px solid #444; color: #aaa; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .list-item.active { border-color: var(--main-color); background: #330000; color: white; transform: translateX(10px); }

        /* 2. 중앙 작업실 (그리드 배경) */
        .workspace { flex: 1; position: relative; background-image: radial-gradient(#333 1px, transparent 1px); background-size: 40px 40px; display: flex; justify-content: center; align-items: center; overflow: hidden; }

        /* ★ 핵심: 엔진 본체 (SVG 그래픽) ★ */
        .engine-core { 
            width: 220px; height: 260px; z-index: 10; position: relative; 
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.8)); transition: 0.5s;
        }
        .engine-core.complete { filter: drop-shadow(0 0 50px var(--main-color)); transform: scale(1.05); }

        /* ★ 핵심: 부품들 (SVG 그래픽) ★ */
        .part { 
            position: absolute; width: 100px; height: 100px; z-index: 20; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.1s linear; cursor: pointer;
        }
        
        /* 말풍선 스타일 */
        .bubble {
            position: absolute; top: -50px; background: white; color: black; padding: 5px 12px; 
            border-radius: 15px; font-weight: bold; font-size: 0.8rem; white-space: nowrap;
            opacity: 0; transition: 0.3s; pointer-events: none; border: 2px solid var(--main-color);
        }
        .bubble::after { content:''; position:absolute; bottom:-6px; left:50%; margin-left:-6px; border-width:6px 6px 0; border-style:solid; border-color:var(--main-color) transparent transparent; }
        
        /* 움직일 때 말풍선 보이기 */
        .part.moving .bubble { opacity: 1; top: -60px; }

        /* 도킹 완료 시 */
        .part.docked { opacity: 0; pointer-events: none; transition: 0.5s; }

        /* 3. 오른쪽 패널 */
        .right-panel { width: 300px; background: var(--panel-color); border-left: 1px solid #333; padding: 30px; display: flex; flex-direction: column; justify-content: center; z-index: 5; }
        
        /* 슬라이더 */
        input[type="range"] { width: 100%; accent-color: var(--main-color); cursor: pointer; margin: 20px 0; }
        .status { text-align: center; font-size: 1.5rem; font-weight: bold; color: var(--main-color); text-transform: uppercase; margin-bottom: 5px; }
        .guide { text-align: center; color: #666; font-size: 0.9rem; }

        /* 하단 버튼 */
        footer { height: 70px; background: #000; border-top: 1px solid #333; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; z-index: 10; }
        .btn-back { color: #888; text-decoration: none; font-size: 0.9rem; }
        
        /* 3D 버튼 */
        .btn-next {
            background: #333; color: #666; padding: 12px 30px; border-radius: 30px; 
            text-decoration: none; font-weight: bold; pointer-events: none; transition: 0.5s;
            border: 1px solid #444;
        }
        .btn-next.active {
            background: var(--main-color); color: white; pointer-events: auto;
            box-shadow: 0 0 20px var(--main-color); border-color: var(--main-color);
        }
    </style>
</head>
<body>
    <header>DREAM-FI ENGINE ASSEMBLY</header>

    <div class="container">
        <div class="left-panel">
            <div class="panel-header">PARTS CHECKLIST</div>
            <div class="list-item" id="list1">⚙️ 1. 변속기 (Transmission)</div>
            <div class="list-item" id="list2">🔩 2. 마운트 (Mount)</div>
            <div class="list-item" id="list3">💧 3. 냉각수 (Cooling)</div>
            <div class="list-item" id="list4">💨 4. 배기구 (Exhaust)</div>
        </div>

        <div class="workspace">
            <div class="engine-core" id="core">
                <svg viewBox="0 0 200 240" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#444"/><stop offset="100%" stop-color="#222"/></linearGradient></defs>
                    <path d="M40,60 L160,60 L180,200 L20,200 Z" fill="url(#metal)" stroke="#666" stroke-width="2"/>
                    <rect x="35" y="30" width="130" height="30" fill="#cc0000" rx="5"/>
                    <rect x="40" y="80" width="120" height="10" fill="#111"/>
                    <rect x="40" y="110" width="120" height="10" fill="#111"/>
                    <text x="100" y="150" text-anchor="middle" fill="#555" font-weight="bold" font-family="Arial" font-size="20">V8 CORE</text>
                </svg>
            </div>

            <div class="part" id="part1">
                <div class="bubble">동력 전달!</div>
                <svg viewBox="0 0 100 100" width="80" height="80">
                    <path d="M10,20 L40,20 L50,80 L20,80 Z" fill="#555" stroke="#aaa"/>
                    <rect x="50" y="30" width="40" height="40" fill="#333" stroke="#aaa"/>
                    <circle cx="70" cy="50" r="10" fill="#111"/>
                </svg>
            </div>

            <div class="part" id="part2">
                <div class="bubble">진동 흡수!</div>
                <svg viewBox="0 0 100 100" width="80" height="80">
                    <rect x="20" y="40" width="60" height="20" fill="#888"/>
                    <path d="M20,60 Q50,90 80,60" fill="none" stroke="#555" stroke-width="5"/>
                </svg>
            </div>

            <div class="part" id="part3">
                <div class="bubble">열 식히기!</div>
                <svg viewBox="0 0 100 100" width="80" height="80">
                    <path d="M50,10 Q90,50 90,70 A40,40 0 0 1 10,70 Q10,50 50,10" fill="#00aaff" stroke="white" stroke-width="2"/>
                </svg>
            </div>

            <div class="part" id="part4">
                <div class="bubble">가스 배출!</div>
                <svg viewBox="0 0 100 100" width="80" height="80">
                    <path d="M10,50 Q50,10 90,50" fill="none" stroke="#e6b800" stroke-width="10" stroke-linecap="round"/>
                </svg>
            </div>
        </div>

        <div class="right-panel">
            <div class="status" id="status-text">READY</div>
            <div class="guide">슬라이더를 당겨 조립하세요</div>
            <input type="range" min="0" max="100" value="0" id="slider">
        </div>
    </div>

    <footer>
        <a href="../../index.html" class="btn-back">◀ 메인 메뉴</a>
        <a href="../1-2-detail/index.html" class="btn-next" id="nextBtn">▶ 엔진 입체 영상 보기 (3D View)</a>
    </footer>

    <script>
        const slider = document.getElementById('slider');
        const statusText = document.getElementById('status-text');
        const nextBtn = document.getElementById('nextBtn');
        const core = document.getElementById('core');
        
        const parts = [
            document.getElementById('part1'), // 변속기
            document.getElementById('part2'), // 마운트
            document.getElementById('part3'), // 냉각수
            document.getElementById('part4')  // 배기구
        ];
        const lists = [
            document.getElementById('list1'),
            document.getElementById('list2'),
            document.getElementById('list3'),
            document.getElementById('list4')
        ];

        // 시작 위치 (중앙 기준)
        const startPos = [
            {x: 250, y: 0},  // 우
            {x: 0, y: 200},  // 하
            {x: -250, y: 0}, // 좌
            {x: 0, y: -200}  // 상
        ];
        
        // 도착 위치 (엔진 중앙)
        const endPos = [
            {x: 60, y: 0}, 
            {x: 0, y: 80}, 
            {x: -60, y: 0}, 
            {x: 0, y: -80}
        ];

        function update(val) {
            const pct = val / 100;
            
            // 텍스트 변경
            if(val < 10) statusText.innerText = "READY";
            else if(val < 90) statusText.innerText = "ASSEMBLING...";
            else statusText.innerText = "COMPLETE!";

            parts.forEach((part, i) => {
                // 위치 이동
                const cx = startPos[i].x + (endPos[i].x - startPos[i].x) * pct;
                const cy = startPos[i].y + (endPos[i].y - startPos[i].y) * pct;
                part.style.transform = `translate(${cx}px, ${cy}px)`;

                // 말풍선 보이기 (움직이는 동안만)
                if(val > 5 && val < 95) part.classList.add('moving');
                else part.classList.remove('moving');

                // 완료 처리
                if(val > 95) {
                    part.classList.add('docked'); // 부품 사라짐(합체됨)
                    lists[i].classList.add('active'); // 리스트 불 들어옴
                } else {
                    part.classList.remove('docked');
                    lists[i].classList.remove('active');
                }
            });

            // 엔진 효과 & 버튼 활성화
            if(val == 100) {
                core.classList.add('complete');
                nextBtn.classList.add('active');
            } else {
                core.classList.remove('complete');
                nextBtn.classList.remove('active');
            }
        }

        slider.addEventListener('input', (e) => update(parseInt(e.target.value)));
        update(0); // 초기화
    </script>
</body>
</html>
