<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Dream-Fi | Minority Report Assembly</title>
    <style>
        :root { --neon: #00f3ff; --red: #ff003c; --bg: #05070a; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Orbitron', sans-serif; overflow: hidden; height: 100vh; }
        
        /* 배경 그리드 */
        .workspace { width: 100vw; height: 100vh; position: relative; 
            background-image: radial-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 1px); background-size: 50px 50px; }

        /* 엔진 타겟 */
        .engine-target { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 250px; height: 250px; border: 2px dashed rgba(0, 243, 255, 0.2); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; transition: 0.5s; }
        .engine-target.active { border-color: var(--red); box-shadow: 0 0 50px rgba(255, 0, 60, 0.3); }

        /* 부품 스타일 */
        .part { position: absolute; width: 100px; cursor: grab; z-index: 20; text-align: center; }
        .part svg { width: 80px; filter: drop-shadow(0 0 10px var(--neon)); transition: 0.3s; }
        .part:active svg { transform: scale(1.1); filter: drop-shadow(0 0 20px var(--neon)); }

        /* 말풍선 레이블 */
        .label { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); 
            background: var(--neon); color: black; padding: 5px 12px; border-radius: 5px; 
            font-size: 11px; font-weight: bold; opacity: 0; transition: 0.3s; white-space: nowrap; }
        .part:hover .label { opacity: 1; top: -50px; }

        /* 다음 단계 버튼 */
        .next-btn { position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); 
            padding: 18px 50px; border-radius: 50px; background: #111; color: #444; 
            text-decoration: none; font-weight: bold; border: 1px solid #333; transition: 0.5s; pointer-events: none; }
        .next-btn.active { background: var(--red); color: white; border-color: var(--red); 
            pointer-events: auto; box-shadow: 0 0 30px var(--red); }
    </style>
</head>
<body>
    <div class="workspace">
        <header style="padding: 20px; text-align: center; border-bottom: 1px solid #1a1a1a; letter-spacing: 5px; color: var(--neon);">
            V8 ENGINE ASSEMBLY PROTOCOL
        </header>

        <div class="engine-target" id="target">
            <svg viewBox="0 0 100 100" width="150"><rect x="25" y="20" width="50" height="60" rx="5" fill="none" stroke="#333" stroke-width="2"/><text x="50" y="55" text-anchor="middle" fill="#222" font-size="8">WAITING FOR PARTS</text></svg>
        </div>

        <div class="part" id="p1" style="top:25%; left:20%;">
            <div class="label">TRANSMISSION (변속기)</div>
            <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="2"/><path d="M50 20v60M20 50h60" stroke="currentColor"/></svg>
        </div>

        <div class="part" id="p2" style="bottom:25%; right:20%;">
            <div class="label">EXHAUST SYSTEM (배기구)</div>
            <svg viewBox="0 0 100 100"><path d="M20 60 Q50 20 80 60" fill="none" stroke="currentColor" stroke-width="5"/></svg>
        </div>
    </div>

    <a href="../1-2-detail/index.html" class="next-btn" id="nextBtn">ANALYZE 3D CORE (다음 단계)</a>

    <script>
        let docked = 0;
        const target = document.getElementById('target').getBoundingClientRect();
        const nextBtn = document.getElementById('nextBtn');

        document.querySelectorAll('.part').forEach(p => {
            let dragging = false;
            p.onmousedown = () => { dragging = true; p.style.zIndex = 100; };
            document.onmousemove = e => {
                if(dragging) {
                    p.style.left = e.clientX - 50 + 'px';
                    p.style.top = e.clientY - 50 + 'px';
                }
            };
            document.onmouseup = () => {
                if(!dragging) return;
                dragging = false;
                const rect = p.getBoundingClientRect();
                const dist = Math.hypot(rect.left - target.left + 50, rect.top - target.top + 50);

                if(dist < 150) { // 도킹 성공
                    p.style.left = '50%'; p.style.top = '50%';
                    p.style.transform = 'translate(-50%, -50%)';
                    p.style.pointerEvents = 'none';
                    p.style.opacity = '0.5';
                    docked++;
                    if(docked >= 2) {
                        document.getElementById('target').classList.add('active');
                        nextBtn.classList.add('active');
                    }
                }
            };
        });
    </script>
</body>
</html>
