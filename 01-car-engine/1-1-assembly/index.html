<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream-Fi Mechanics | 1-1</title>
    <style>
        /* 기본 설정 */
        body {
            background-color: #050505; color: white; font-family: sans-serif;
            margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        header {
            padding: 15px 30px; border-bottom: 1px solid #333; display: flex; justify-content: center;
            background: #111; z-index: 10;
        }
        .logo { font-size: 1.2rem; font-weight: 900; color: #ff4d4d; letter-spacing: 1px; }

        .main-container { display: flex; flex: 1; height: 100%; }
        
        /* 왼쪽 패널 */
        .minimap-panel {
            width: 250px; border-right: 1px solid #333; background: #0f0f0f;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .map-box {
            width: 150px; height: 250px; border: 2px dashed #444; position: relative;
            display: flex; justify-content: center; align-items: center;
        }
        .car-outline { width: 100px; height: 180px; border: 2px solid #555; border-radius: 10px; }
        .engine-slot {
            width: 60px; height: 80px; background: rgba(255, 77, 77, 0.2); border: 1px solid #ff4d4d;
            margin-top: 20px; box-shadow: 0 0 10px #ff4d4d;
        }
        .status-text { margin-top: 20px; font-size: 0.8rem; color: #666; text-align: center; }
        .status-highlight { color: #ff4d4d; font-weight: bold; }

        /* 중앙 작업 공간 */
        .workspace {
            flex: 1; position: relative; background: radial-gradient(circle at center, #222 0%, #000 100%);
            display: flex; justify-content: center; align-items: center;
        }
        .tag {
            position: absolute; padding: 5px 10px; background: rgba(0,0,0,0.7); border-radius: 4px;
            font-size: 0.8rem; font-weight: bold; color: white; border-left: 3px solid #ff4d4d;
        }

        /* ★ 디자인 복구: 중앙 엔진 ★ */
        .engine-icon {
            width: 140px; height: 180px; background: #2a2a2a; border-radius: 15px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 2px solid #444;
            transition: 0.5s; z-index: 2; font-weight: 800; color: #666; font-size: 1.2rem;
            flex-direction: column; gap: 10px;
        }
        .engine-detail { width: 80%; height: 5px; background: #111; border-radius: 2px; }

        /* ★ 디자인 복구: 부품들 ★ */
        .part {
            position: absolute; width: 90px; height: 90px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 0.8rem; color: #ccc; font-weight: bold;
            transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer;
            background: rgba(255,255,255,0.05); border: 1px solid #444; border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        /* 부품 개별 디자인 */
        #part1 { border-top: 4px solid #aaa; } /* 변속기 */
        #part2 { border-bottom: 4px solid #aaa; } /* 마운트 */
        #part3 { border-left: 4px solid #00ccff; color: #00ccff; } /* 냉각수 */
        #part4 { border-right: 4px solid #ffcc00; color: #ffcc00; } /* 배기구 */

        .part:hover { border-color: #ff4d4d; color: white; transform: scale(1.1); background: #222; }

        /* 오른쪽 패널 */
        .control-panel { width: 320px; background: #111; border-left: 1px solid #333; padding: 20px; }
        .panel-header { font-size: 1rem; font-weight: bold; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .step-indicator { font-size: 0.8rem; color: #666; }
        
        .slider-container { margin-bottom: 30px; background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .slider-label { font-size: 0.8rem; color: #ff4d4d; font-weight: bold; margin-bottom: 10px; display: block; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #ff4d4d; }
        
        .checklist { display: flex; flex-direction: column; gap: 10px; }
        .check-item {
            background: #1a1a1a; padding: 12px; border-radius: 6px; border: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;
        }
        .check-icon { width: 16px; height: 16px; background: #333; border-radius: 50%; }
        .check-item.active { border-color: #ff4d4d; background: rgba(255, 77, 77, 0.1); }
        .check-item.active .check-icon { background: #ff4d4d; box-shadow: 0 0 5px #ff4d4d; }

        /* 하단 네비게이션 */
        footer {
            height: 60px; background: #000; border-top: 1px solid #333; display: flex;
            justify-content: space-between; align-items: center; padding: 0 20px;
        }
        .nav-btn {
            text-decoration: none; color: #888; font-size: 0.9rem; transition: 0.3s;
            display: flex; align-items: center; gap: 5px;
        }
        .nav-btn:hover { color: white; }
        
        /* 3D 버튼 스타일 */
        .next-btn {
            background: #ff4d4d; color: white; padding: 10px 20px; border-radius: 30px;
            font-weight: bold; text-decoration: none; font-size: 0.9rem;
            display: flex; align-items: center; gap: 5px; transition: 0.3s;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.3);
        }
        .next-btn:hover { background: #ff0000; box-shadow: 0 0 20px rgba(255, 77, 77, 0.6); transform: translateY(-2px); }

    </style>
</head>
<body>
    <header>
        <div class="logo">DREAM-FI MECHANICS | 1-1</div>
    </header>

    <div class="main-container">
        <div class="minimap-panel">
            <div class="tag" style="top: 20px; left: 20px;">LOCATION MAP</div>
            <div class="map-box">
                <div class="car-outline">
                    <div style="width: 100%; height: 30%; border-bottom: 1px solid #555;"></div>
                </div>
                <div class="engine-slot" style="position: absolute;">
                    <div style="width: 100%; height: 100%; background: #ff4d4d; opacity: 0.5;"></div>
                </div>
            </div>
            <p class="status-text">현재 <span class="status-highlight">엔진룸(Front)</span><br>작업 중입니다.</p>
        </div>

        <div class="workspace">
            <div class="tag" style="top: 20px; left: 20px;">DOCKING VIEW</div>
            
            <div class="engine-icon" id="core-engine">
                <div class="engine-detail"></div>
                <div class="engine-detail"></div>
                <span>V8 ENGINE</span>
                <div class="engine-detail"></div>
                <div class="engine-detail"></div>
            </div>

            <div class="part" id="part1" style="transform: translate(220px, 0);">
                <div style="font-size:1.5rem;">⚙️</div>
                <span>1. 변속기</span>
            </div>
            <div class="part" id="part2" style="transform: translate(0, 220px);">
                <div style="font-size:1.5rem;">🔩</div>
                <span>2. 마운트</span>
            </div>
            <div class="part" id="part3" style="transform: translate(-220px, -50px);">
                <div style="font-size:1.5rem;">💧</div>
                <span>3. 냉각수</span>
            </div>
            <div class="part" id="part4" style="transform: translate(50px, -220px);">
                <div style="font-size:1.5rem;">💨</div>
                <span>4. 배기구</span>
            </div>

            <p style="position: absolute; bottom: 50px; color: #444; font-size: 0.8rem;">Drag to Rotate 360°</p>
        </div>

        <div class="control-panel">
            <div class="panel-header">
                <span>⚙️ 엔진 도킹</span>
                <span class="step-indicator">Step 1-1</span>
            </div>

            <div class="slider-container">
                <label class="slider-label">DOCKING SLIDER</label>
                <input type="range" min="0" max="100" value="0" id="dock-slider">
                <p style="text-align: center; font-size: 0.8rem; margin-top: 10px; color: white;" id="slider-text">도킹 대기 (Standby)</p>
            </div>

            <div class="checklist">
                <div class="check-item" id="check1"><span>1. 변속기 (뒤)</span><div class="check-icon"></div></div>
                <div class="check-item" id="check2"><span>2. 엔진 마운트 (아래)</span><div class="check-icon"></div></div>
                <div class="check-item" id="check3"><span>3. 냉각수 호스 (앞)</span><div class="check-icon"></div></div>
                <div class="check-item" id="check4"><span>4. 배기 매니폴드 (위)</span><div class="check-icon"></div></div>
            </div>
        </div>
    </div>

    <footer>
        <a href="../../index.html" class="nav-btn">◀ 이전 단계 (메인 메뉴)</a>
        
        <div style="display: flex; gap: 15px;">
            <a href="../../index.html" class="nav-btn">목차로 가기 (Menu) 🏠</a>
            <a href="../1-2-detail/index.html" class="next-btn">▶ 다음 단계 (3D 보기)</a>
        </div>
    </footer>

    <script>
        const slider = document.getElementById('dock-slider');
        const parts = [
            document.getElementById('part1'),
            document.getElementById('part2'),
            document.getElementById('part3'),
            document.getElementById('part4')
        ];
        const checks = [
            document.getElementById('check1'),
            document.getElementById('check2'),
            document.getElementById('check3'),
            document.getElementById('check4')
        ];
        const engine = document.getElementById('core-engine');
        const sliderText = document.getElementById('slider-text');

        // 초기 위치 저장
        const initialPos = [
            {x: 220, y: 0}, {x: 0, y: 220}, {x: -220, y: -50}, {x: 50, y: -220}
        ];

        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            const progress = val / 100;

            if(val < 10) sliderText.innerText = "도킹 대기 (Standby)";
            else if(val < 90) sliderText.innerText = "도킹 중... (Docking)";
            else sliderText.innerText = "도킹 완료! (Complete)";

            parts.forEach((part, index) => {
                const startX = initialPos[index].x;
                const startY = initialPos[index].y;
                const currentX = startX * (1 - progress);
                const currentY = startY * (1 - progress);
                part.style.transform = `translate(${currentX}px, ${currentY}px)`;
                
                if(val > 80) {
                    part.style.borderColor = "#ff4d4d";
                    part.style.background = "#222";
                    part.style.color = "white";
                    checks[index].classList.add('active');
                } else {
                    part.style.borderColor = "#444";
                    part.style.background = "rgba(255,255,255,0.05)";
                    if(index === 2) part.style.color = "#00ccff"; // 냉각수 색 복구
                    else if(index === 3) part.style.color = "#ffcc00"; // 배기구 색 복구
                    else part.style.color = "#ccc";
                    checks[index].classList.remove('active');
                }
            });

            if(val == 100) {
                engine.style.boxShadow = "0 0 50px #ff4d4d";
                engine.style.borderColor = "white";
                engine.style.color = "white";
            } else {
                engine.style.boxShadow = "0 20px 50px rgba(0,0,0,0.8)";
                engine.style.borderColor = "#444";
                engine.style.color = "#666";
            }
        });
    </script>
</body>
</html>
