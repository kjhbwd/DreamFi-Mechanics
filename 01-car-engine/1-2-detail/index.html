<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream-Fi #01-2: V8 엔진 리얼리티</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f0f0f; color: white; font-family: sans-serif; }
        
        /* 로딩 화면 스타일 */
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 999;
            transition: opacity 0.5s;
        }
        .loader {
            border: 4px solid #333; border-top: 4px solid #ffcc00; border-radius: 50%;
            width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* UI 및 텍스트 */
        #ui-container {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            text-align: center; pointer-events: none; width: 100%;
        }
        h1 { margin: 0; font-size: 1.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        p { color: #888; font-size: 0.9rem; margin-top: 5px; }
        
        /* 뒤로가기 버튼 */
        .back-btn {
            position: absolute; top: 20px; left: 20px; text-decoration: none;
            color: rgba(255,255,255,0.7); font-weight: bold; font-size: 0.9rem;
            background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 20px;
            z-index: 100; transition: 0.3s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.2); color: white; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loading-screen">
        <div class="loader"></div>
        <div id="loading-text">3D 엔진 로딩 중...</div>
    </div>

    <a href="../index.html" class="back-btn">◀ 뒤로 가기</a>

    <div id="ui-container">
        <h1>V8 ENGINE DETAIL</h1>
        <p>마우스 드래그: 회전 / 휠: 확대</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. 무대 설치
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111); // 어두운 배경

        // 2. 카메라 설치
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3, 5); // 보기 좋은 각도

        // 3. 렌더러 (화질 설정)
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // 4. 조명 설치 (스튜디오 조명)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffcc00, 3); // 주광색
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);
        
        const rimLight = new THREE.DirectionalLight(0x4455ff, 2); // 푸른 역광
        rimLight.position.set(-5, 0, -5);
        scene.add(rimLight);

        // 5. 마우스 컨트롤
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true; // 자동 회전
        controls.autoRotateSpeed = 1.0;

        // 6. ★핵심★ 모델 불러오기 (engine.glb)
        const loader = new GLTFLoader();
        loader.load('./engine.glb', function (gltf) {
            const model = gltf.scene;
            
            // 모델 위치 중앙 정렬
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            
            model.position.x += (model.position.x - center.x);
            model.position.y += (model.position.y - center.y);
            model.position.z += (model.position.z - center.z);
            
            scene.add(model);
            
            // 로딩 화면 끄기
            document.getElementById('loading-screen').style.opacity = 0;
            setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);

        }, undefined, function (error) {
            console.error(error);
            document.getElementById('loading-text').innerText = "파일을 찾을 수 없습니다! (파일명: engine.glb)";
            document.getElementById('loading-text').style.color = "red";
        });

        // 7. 화면 그리기 반복
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 창 크기 조절 대응
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
