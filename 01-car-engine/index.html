<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream-Fi #01: 엔진</title>
    <style>
        /* [전역 스타일] */
        :root { --brand-gold: #ffcc00; --bg-dark: #121212; --panel-bg: #1e1e1e; }
        body { background: var(--bg-dark); color: white; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* 헤더 */
        header { height: 60px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #333; background: #111; z-index: 10; }
        .brand-title { color: var(--brand-gold); font-weight: 800; letter-spacing: 1px; font-size: 1.2rem; }

        /* 메인 컨테이너 (50:50) */
        .main-container { display: flex; flex: 1; height: calc(100vh - 60px); }

        /* [왼쪽] 전체 맵 */
        .left-panel { flex: 1; background: radial-gradient(circle at center, #2a2a2a, #121212); border-right: 1px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .panel-label { position: absolute; top: 20px; left: 20px; color: #555; font-size: 0.8rem; font-weight: bold; border: 1px solid #555; padding: 5px 10px; border-radius: 5px; }

        /* [오른쪽] 시뮬레이터 */
        .right-panel { flex: 1; background: var(--panel-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

        canvas { max-width: 100%; max-height: 100%; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }

        /* 컨트롤러 UI */
        .controls-box { width: 80%; text-align: center; margin-top: 20px; }
        input[type=range] { width: 100%; accent-color: var(--brand-gold); cursor: pointer; height: 8px; border-radius: 5px; }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .info-btn { background: var(--brand-gold); color: #000; border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
        .info-btn:hover { background: white; transform: scale(1.05); }

        /* 사운드 버튼 스타일 (OFF/ON) */
        #sound-btn { background: #333; color: #fff; border: 1px solid #555; }
        #sound-btn.active { background: #ff4444; color: white; border-color: #ff4444; animation: pulse 1s infinite; }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(255, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); } }

        /* 팝업창 */
        #info-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: #222; border: 2px solid var(--brand-gold); padding: 30px; border-radius: 20px; width: 320px; text-align: center; box-shadow: 0 0 30px rgba(255,204,0,0.2); }
        .nav-back { position: absolute; bottom: 20px; right: 20px; color: #666; text-decoration: none; font-size: 0.8rem; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; overflow-y: auto; }
            .left-panel { flex: 0.8; min-height: 250px; border-right: none; border-bottom: 1px solid #333; }
            .right-panel { flex: 1.2; }
            body { overflow: auto; }
        }
    </style>
</head>
<body>

    <div id="info-modal">
        <div class="modal-content">
            <h3 style="color:var(--brand-gold); margin-top:0;">4행정 엔진의 비밀 🔥</h3>
            <p style="text-align: left; line-height: 1.6; color: #ddd; font-size: 0.95rem;">
                <b>1. 흡입:</b> 공기를 꿀꺽! (연료+공기)<br>
                <b>2. 압축:</b> 꽉 눌러서 뜨겁게!<br>
                <b>3. 폭발:</b> 쾅! 에너지가 생겨요.<br>
                <b>4. 배기:</b> 찌꺼기를 밖으로 퉤!<br><br>
                이 4박자가 맞춰져야 자동차 심장이 뜁니다.
            </p>
            <button onclick="toggleModal()" style="background:#444; color:#fff; border:none; padding:10px 30px; border-radius:8px; cursor:pointer;">알겠어요!</button>
        </div>
    </div>

    <header>
        <div class="brand-title">DREAM-FI MECHANICS #01</div>
    </header>

    <div class="main-container">
        <div class="left-panel">
            <div class="panel-label">📍 CAR DIAGNOSTIC MAP</div>
            <canvas id="mapCanvas" width="300" height="400"></canvas>
            <div style="color:#666; font-size:0.8rem; margin-top:10px;">▲ 현재 작동 부위: <span style="color:var(--brand-gold);">엔진 (심장)</span></div>
        </div>

        <div class="right-panel">
            <div class="btn-group">
                <button class="info-btn" onclick="toggleModal()">💡 원리 보기</button>
                <button class="info-btn" id="sound-btn" onclick="toggleSound()">🔇 소리 켜기</button>
            </div>
            
            <div style="font-size:1.5rem; font-weight:900; margin-bottom:10px; height:30px;" id="status-label">READY</div>
            
            <canvas id="engineCanvas" width="300" height="250"></canvas>
            
            <div class="controls-box">
                <div style="color:#aaa; font-size:0.9rem; margin-bottom:10px;">엔진 속도 (RPM)</div>
                <input type="range" id="speedRange" min="0.01" max="0.2" step="0.01" value="0.05">
            </div>
            
            <a href="../index.html" class="nav-back">← 목차로</a>
        </div>
    </div>

    <script>
        /* ========================
           1. 사운드 시스템 (Web Audio API)
           ======================== */
        let audioCtx;
        let oscillator;
        let gainNode;
        let filterNode; // 소리를 부드럽게 만드는 필터
        let isSoundOn = false;
        const soundBtn = document.getElementById('sound-btn');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function toggleSound() {
            initAudio(); // 오디오 컨텍스트 준비
            
            if (isSoundOn) {
                // 소리 끄기
                if (oscillator) {
                    oscillator.stop();
                    oscillator.disconnect();
                }
                isSoundOn = false;
                soundBtn.innerHTML = "🔇 소리 켜기";
                soundBtn.classList.remove("active");
            } else {
                // 소리 켜기
                oscillator = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();
                filterNode = audioCtx.createBiquadFilter();

                // 엔진음 만들기 (톱니파 + 로우패스 필터)
                oscillator.type = 'sawtooth'; // 거친 기계음
                filterNode.type = 'lowpass'; // 날카로운 소리 깎기
                filterNode.frequency.value = 400; // 웅웅거리는 느낌

                // RPM 초기값 반영
                const currentSpeed = parseFloat(document.getElementById('speedRange').value);
                oscillator.frequency.value = 60 + (currentSpeed * 800); 

                gainNode.gain.value = 0.15; // 볼륨 (너무 크지 않게)

                // 연결: 오실레이터 -> 필터 -> 볼륨 -> 스피커
                oscillator.connect(filterNode);
                filterNode.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                isSoundOn = true;
                soundBtn.innerHTML = "🔊 시동 끄기";
                soundBtn.classList.add("active");
            }
        }

        /* 2. 왼쪽 맵 (Context) */
        const mapCanvas = document.getElementById('mapCanvas');
        const mapCtx = mapCanvas.getContext('2d');
        let engineGlow = 0;

        function drawMap() {
            mapCtx.clearRect(0, 0, mapCanvas.width, mapCanvas.height);
            
            // 차체 프레임
            mapCtx.strokeStyle = "#444"; mapCtx.lineWidth = 3;
            mapCtx.strokeRect(100, 80, 100, 240); 
            mapCtx.fillStyle = "#333";
            mapCtx.fillRect(70, 100, 30, 50); mapCtx.fillRect(200, 100, 30, 50); 
            mapCtx.fillRect(70, 260, 30, 50); mapCtx.fillRect(200, 260, 30, 50); 

            // 엔진 위치
            engineGlow += 0.1;
            const alpha = (Math.sin(engineGlow) + 1) / 2 * 0.5 + 0.2;
            
            mapCtx.fillStyle = `rgba(255, 204, 0, ${alpha})`;
            mapCtx.shadowBlur = 20; mapCtx.shadowColor = "#ffcc00";
            mapCtx.fillRect(125, 100, 50, 50);
            mapCtx.shadowBlur = 0;

            mapCtx.fillStyle = "#fff"; mapCtx.font = "bold 12px sans-serif";
            mapCtx.fillText("ENGINE", 128, 130);
            
            mapCtx.beginPath(); mapCtx.strokeStyle = "#ffcc00"; mapCtx.lineWidth = 2; mapCtx.setLineDash([5, 5]);
            mapCtx.rect(90, 90, 120, 70); mapCtx.stroke(); mapCtx.setLineDash([]);

            requestAnimationFrame(drawMap);
        }
        drawMap();

        /* 3. 오른쪽 시뮬레이터 (엔진 로직) */
        const canvas = document.getElementById('engineCanvas');
        const ctx = canvas.getContext('2d');
        const statusLabel = document.getElementById('status-label');
        const speedRange = document.getElementById('speedRange');

        let angle = 0;
        const centerX = 150; const centerY = 150;
        const crankRadius = 45; const rodLength = 110; const cylinderWidth = 90;

        function drawEngine() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const speed = parseFloat(speedRange.value);
            angle += speed;
            const cycleAngle = angle % (Math.PI * 4);

            // 소리 주파수 업데이트 (RPM에 따라 톤 변경)
            if(isSoundOn && oscillator) {
                // 속도가 빠를수록 주파수(Hz)를 높임
                oscillator.frequency.value = 60 + (speed * 1000);
            }

            let state = ""; let color = "#fff";
            if (cycleAngle < Math.PI) { state = "1. 흡입 😋"; color = "#0096ff"; }
            else if (cycleAngle < Math.PI * 2) { state = "2. 압축 꾹!"; color = "#00ff64"; }
            else if (cycleAngle < Math.PI * 3) { state = "3. 폭발 !! 💥"; color = "#ff6400"; }
            else { state = "4. 배기 후~"; color = "#aaaaaa"; }

            statusLabel.innerText = state;
            statusLabel.style.color = color;

            const crankX = centerX + Math.cos(angle) * crankRadius;
            const crankY = centerY + Math.sin(angle) * crankRadius;
            const pistonY = centerY - Math.sqrt(rodLength**2 - (crankX - centerX)**2) + Math.sin(angle) * crankRadius - 30;

            // 실린더
            ctx.strokeStyle = "#444"; ctx.lineWidth = 5; ctx.strokeRect(centerX - cylinderWidth/2, 20, cylinderWidth, 140);
            ctx.fillStyle = color; ctx.globalAlpha = 0.2; ctx.fillRect(centerX - cylinderWidth/2, 20, cylinderWidth, pistonY - 20); ctx.globalAlpha = 1.0;
            // 로드 & 피스톤 & 크랭크
            ctx.beginPath(); ctx.moveTo(centerX, pistonY); ctx.lineTo(crankX, crankY); ctx.strokeStyle = "#777"; ctx.lineWidth = 12; ctx.stroke();
            ctx.fillStyle = "#fff"; ctx.fillRect(centerX - cylinderWidth/2 + 5, pistonY - 20, cylinderWidth - 10, 35);
            ctx.beginPath(); ctx.arc(crankX, crankY, 15, 0, Math.PI * 2); ctx.fillStyle = "#ffcc00"; ctx.fill();

            requestAnimationFrame(drawEngine);
        }
        drawEngine();

        function toggleModal() {
            const modal = document.getElementById('info-modal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        }
    </script>
</body>
</html>
