<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream-Fi #01: 엔진 (Engine)</title>
    <style>
        :root { --brand-gold: #ffcc00; --brand-red: #ff4444; --bg-dark: #0f0f0f; }
        
        body { 
            background: var(--bg-dark); color: white; font-family: 'Pretendard', sans-serif; 
            margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
        }

        header { height: 60px; display: flex; align-items: center; justify-content: center; background: #000; border-bottom: 1px solid #333; flex-shrink: 0; }
        .brand-title { color: var(--brand-red); font-weight: 900; letter-spacing: 1px; font-size: 1.2rem; }

        .main-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background: radial-gradient(circle at center, #222 0%, #000 80%); }

        canvas { filter: drop-shadow(0 0 30px rgba(255, 68, 68, 0.2)); cursor: grab; }
        canvas:active { cursor: grabbing; }

        .info-box { position: absolute; bottom: 100px; text-align: center; width: 80%; pointer-events: none; }
        .info-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; color: #fff; text-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .info-desc { font-size: 0.9rem; color: #aaa; line-height: 1.5; }

        /* [핵심: 다음 단계로 가는 버튼] */
        .nav-footer { 
            height: 80px; background: #000; border-top: 1px solid #333; flex-shrink: 0;
            display: flex; justify-content: space-between; align-items: center; padding: 0 30px;
        }
        
        .nav-btn { 
            text-decoration: none; color: #888; font-size: 0.9rem; font-weight: bold; 
            padding: 12px 24px; border-radius: 8px; transition: 0.3s; border: 1px solid transparent;
        }
        .nav-btn:hover { background: #222; color: #fff; }

        /* 다음 단계 강조 버튼 */
        .nav-btn.next { 
            background: rgba(255, 68, 68, 0.15); color: var(--brand-red); border: 1px solid var(--brand-red); 
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.2);
        }
        .nav-btn.next:hover { 
            background: var(--brand-red); color: #000; transform: scale(1.05); 
            box-shadow: 0 0 25px rgba(255, 68, 68, 0.5);
        }

    </style>
</head>
<body>

    <header>
        <div class="brand-title">DREAM-FI MECHANICS | 01</div>
    </header>

    <div class="main-container" id="canvas-container">
        <canvas id="engineCanvas" width="400" height="400"></canvas>
        
        <div class="info-box">
            <div class="info-title">V4 Engine Block</div>
            <div class="info-desc">
                자동차의 심장입니다.<br>
                이제 이 심장을 차체에 연결하러 가볼까요?
            </div>
        </div>
    </div>

    <footer class="nav-footer">
        <a href="../index.html" class="nav-btn">
            🏠 홈으로 (Home)
        </a>
        
        <a href="./1-1-assembly/index.html" class="nav-btn next">
            NEXT: 엔진 도킹 (Step 1-1) 🚀
        </a>
    </footer>

    <script>
        const canvas = document.getElementById('engineCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        let angle = 0;
        let isDragging = false;
        let lastX = 0;

        // 마우스 인터랙션
        container.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; });
        window.addEventListener('mouseup', () => isDragging = false);
        container.addEventListener('mousemove', e => {
            if(isDragging) {
                const delta = e.clientX - lastX;
                angle += delta * 0.01;
                lastX = e.clientX;
            }
        });

        // 엔진 드로잉 (간단한 3D 와이어프레임)
        function drawEngine() {
            ctx.clearRect(0, 0, 400, 400);
            const cx = 200, cy = 200;
            
            // 자동 회전 (드래그 안 할 때)
            if(!isDragging) angle += 0.005;

            ctx.save();
            ctx.translate(cx, cy);
            
            // 3D 효과를 위한 변환
            const scale = 100;
            
            // 큐브 점들 계산
            const points = [];
            [ -1, 1 ].forEach(x => {
                [ -1.2, 1.2 ].forEach(y => {
                    [ -1, 1 ].forEach(z => {
                        // 회전 적용
                        const rx = x * Math.cos(angle) - z * Math.sin(angle);
                        const rz = x * Math.sin(angle) + z * Math.cos(angle);
                        points.push({ x: rx, y: y, z: rz });
                    });
                });
            });

            // 엔진 블록 그리기
            ctx.strokeStyle = "#ff4444";
            ctx.lineWidth = 2;
            ctx.lineJoin = "round";
            
            ctx.beginPath();
            // 윗면, 아랫면 연결
            for(let i=0; i<4; i++) {
                const p1 = points[i];
                const p2 = points[i+4];
                ctx.moveTo(p1.x * scale, p1.y * scale);
                ctx.lineTo(p2.x * scale, p2.y * scale);
            }
            // 옆면 연결
            ctx.moveTo(points[0].x*scale, points[0].y*scale); ctx.lineTo(points[1].x*scale, points[1].y*scale);
            ctx.lineTo(points[3].x*scale, points[3].y*scale); ctx.lineTo(points[2].x*scale, points[2].y*scale);
            ctx.lineTo(points[0].x*scale, points[0].y*scale);

            ctx.moveTo(points[4].x*scale, points[4].y*scale); ctx.lineTo(points[5].x*scale, points[5].y*scale);
            ctx.lineTo(points[7].x*scale, points[7].y*scale); ctx.lineTo(points[6].x*scale, points[6].y*scale);
            ctx.lineTo(points[4].x*scale, points[4].y*scale);
            
            ctx.stroke();

            // 내부 피스톤 (원) 표현
            ctx.fillStyle = "rgba(255, 68, 68, 0.1)";
            ctx.beginPath();
            ctx.arc(0, -40, 30 * Math.abs(Math.sin(angle)), 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0, 40, 30 * Math.abs(Math.cos(angle)), 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
            requestAnimationFrame(drawEngine);
        }
        drawEngine();
    </script>
</body>
</html>
