<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream-Fi #04: 제동 장치 (조립 구조)</title>
    <style>
        :root { --brand-gold: #ffcc00; --brand-red: #ff4444; --bg-dark: #121212; --panel-bg: #1e1e1e; }
        body { background: var(--bg-dark); color: white; font-family: 'Pretendard', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { height: 60px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #333; background: #111; z-index: 10; }
        .brand-title { color: var(--brand-red); font-weight: 800; letter-spacing: 1px; font-size: 1.2rem; }

        .main-container { display: flex; flex: 1; height: calc(100vh - 60px); }

        /* 왼쪽 패널: 3D 부품 뷰 */
        .left-panel { flex: 1; background: radial-gradient(circle at center, #2a2a2a, #000); border-right: 1px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: grab; }
        .left-panel:active { cursor: grabbing; }
        .panel-label { position: absolute; top: 20px; left: 20px; color: #aaa; font-size: 0.8rem; font-weight: bold; border: 1px solid #555; padding: 5px 10px; border-radius: 5px; background: rgba(0,0,0,0.5); }
        .mouse-guide { position: absolute; bottom: 20px; color: #888; font-size: 0.8rem; animation: blink 2s infinite; pointer-events: none; }

        /* 오른쪽 패널: 분해 조작 */
        .right-panel { flex: 1; background: var(--panel-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; border-left: 1px solid #333; }

        canvas { max-width: 100%; max-height: 100%; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.8)); }

        .controls-box { width: 80%; text-align: center; margin-top: 40px; }
        input[type=range] { width: 100%; accent-color: var(--brand-gold); cursor: pointer; height: 8px; border-radius: 5px; }
        
        .part-list { width: 80%; text-align: left; margin-bottom: 20px; }
        .part-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333; font-size: 0.9rem; color: #888; transition: 0.3s; }
        .part-item.active { color: white; font-weight: bold; border-bottom: 1px solid var(--brand-red); }
        .part-name { color: var(--brand-gold); }

        .nav-back { position: absolute; bottom: 20px; right: 20px; color: #666; text-decoration: none; font-size: 0.8rem; }
        @keyframes blink { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; overflow-y: auto; }
            .left-panel { flex: 0.8; min-height: 350px; border-right: none; border-bottom: 1px solid #333; }
            .right-panel { flex: 1.2; }
            body { overflow: auto; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">DREAM-FI MECHANICS #04</div>
    </header>

    <div class="main-container">
        <div class="left-panel" id="map-container">
            <div class="panel-label">📍 WHEEL ASSEMBLY (Exploded View)</div>
            <canvas id="mapCanvas" width="500" height="400"></canvas>
            <div class="mouse-guide">🖱️ 마우스를 움직여 구조를 돌려보세요</div>
        </div>

        <div class="right-panel">
            <h3 style="color:white; margin-bottom: 20px;">🔧 부품 연결 구조</h3>
            
            <div class="part-list">
                <div class="part-item" id="part-knuckle">
                    <span>1. 너클 & 허브</span>
                    <span style="font-size:0.8rem;">(뼈대)</span>
                </div>
                <div class="part-item" id="part-disc">
                    <span>2. 브레이크 디스크</span>
                    <span style="font-size:0.8rem;">(회전판)</span>
                </div>
                <div class="part-item" id="part-caliper">
                    <span class="part-name">3. 캘리퍼</span>
                    <span style="font-size:0.8rem;">(잡는 놈)</span>
                </div>
                <div class="part-item" id="part-wheel">
                    <span>4. 휠 & 타이어</span>
                    <span style="font-size:0.8rem;">(껍데기)</span>
                </div>
            </div>

            <div class="controls-box">
                <div style="color:#aaa; font-size:0.9rem; margin-bottom:15px;">🛠️ 분해 / 조립 (Assembly Slider)</div>
                <input type="range" id="explodeRange" min="0" max="100" step="1" value="0">
                <div id="statusText" style="color:var(--brand-gold); font-weight:bold; margin-top:10px; font-size: 1rem;">조립 완료 (Ready)</div>
            </div>
            
            <a href="../index.html" class="nav-back">← 목차로</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const explodeRange = document.getElementById('explodeRange');
        const statusText = document.getElementById('statusText');
        const mapContainer = document.getElementById('map-container');

        // 마우스 컨트롤 변수
        let mouseX = 0;
        let targetAngle = 0.5; // 약간 측면에서 시작
        let currentAngle = 0.5;

        mapContainer.addEventListener('mousemove', (e) => {
            const rect = mapContainer.getBoundingClientRect();
            // 마우스 위치를 -1 ~ 1 사이 값으로 변환
            mouseX = ((e.clientX - rect.left) / rect.width) * 2 - 1; 
        });

        // 3D 투영 함수
        function project3D(x, y, z, angle) {
            const scale = 120; 
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            // Y축 회전
            const rad = angle * 1.5; // 회전 범위
            const rx = x * Math.cos(rad) - z * Math.sin(rad);
            const rz = x * Math.sin(rad) + z * Math.cos(rad);
            
            // 원근감
            const depth = 500 / (500 - rz * 100); 
            
            return {
                x: cx + rx * scale * depth,
                y: cy + y * scale * depth,
                scale: depth,
                zIndex: rz // 그리기 순서 정할 때 사용
            };
        }

        // 원기둥(디스크/휠) 그리기 함수
        function drawCylinder(x, y, z, radius, width, color, angle, gap) {
            const steps = 20;
            const points = [];
            
            // 앞면, 뒷면 원 좌표 계산
            for (let i = 0; i < steps; i++) {
                const theta = (i / steps) * Math.PI * 2;
                const px = Math.cos(theta) * radius; // 원형
                const py = Math.sin(theta) * radius;
                
                // x, y, z 좌표계에서 옆으로 누운 원통 (X축이 두께)
                // gap: 분해될 때 X축으로 벌어짐
                points.push({ x: gap + width/2, y: px, z: py }); // 앞면
                points.push({ x: gap - width/2, y: px, z: py }); // 뒷면
            }
            
            // 투영 후 그리기
            ctx.fillStyle = color;
            ctx.strokeStyle = "rgba(255,255,255,0.2)";
            
            // 덩어리로 그리기 (간단화)
            const center = project3D(gap, y, z, angle);
            
            // 약간의 3D 느낌을 위한 타원
            ctx.beginPath();
            ctx.ellipse(center.x, center.y, width * 50 * center.scale, radius * 120 * center.scale, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.stroke();
        }

        // [핵심] 조립 구조 그리기
        function drawAssembly() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 회전 부드럽게
            targetAngle = mouseX;
            currentAngle += (targetAngle - currentAngle) * 0.1;

            const explode = parseInt(explodeRange.value); // 0 ~ 100
            
            // 분해 거리 계산 (X축으로 벌어짐)
            const gap1 = 0;                     // 너클 (고정)
            const gap2 = explode * 0.015;       // 디스크
            const gap3 = explode * 0.015;       // 캘리퍼 (디스크 위에 붙음)
            const gap4 = explode * 0.04;        // 휠 (가장 멀리)

            // 텍스트 업데이트
            if(explode < 10) statusText.innerText = "조립 완료 (Ready)";
            else if(explode < 50) statusText.innerText = "캘리퍼 분리 중...";
            else statusText.innerText = "완전 분해 (Exploded)";

            // 부품 하이라이트
            document.querySelectorAll('.part-item').forEach(el => el.classList.remove('active'));
            if(explode < 20) document.getElementById('part-wheel').classList.add('active');
            else if(explode < 50) document.getElementById('part-caliper').classList.add('active');
            else if(explode < 80) document.getElementById('part-disc').classList.add('active');
            else document.getElementById('part-knuckle').classList.add('active');

            // [그리기 순서] 안쪽 -> 바깥쪽 (Z-index 정렬은 복잡하니 단순화)
            // 실제로는 각도에 따라 그리는 순서를 바꿔야 하지만, 
            // 여기서는 "분해되었을 때 잘 보이는 것"에 집중
            
            // 1. 너클 & 허브 (가장 안쪽, 뼈대)
            const pKnuckle = project3D(-0.5, 0, 0, currentAngle);
            ctx.fillStyle = "#555";
            ctx.fillRect(pKnuckle.x - 20, pKnuckle.y - 60, 40, 120); // 서스펜션 기둥
            ctx.fillStyle = "#777";
            ctx.beginPath(); ctx.arc(pKnuckle.x, pKnuckle.y, 30 * pKnuckle.scale, 0, Math.PI*2); ctx.fill(); // 허브
            ctx.fillStyle = "#fff"; ctx.font = "12px sans-serif"; ctx.fillText("1. Knuckle", pKnuckle.x - 20, pKnuckle.y - 70);

            // 2. 브레이크 디스크 (허브에 끼워짐)
            const pDisc = project3D(gap2, 0, 0, currentAngle);
            ctx.fillStyle = "#ccc"; // 은색 디스크
            ctx.beginPath();
            // 옆에서 본 얇은 원판 느낌
            ctx.ellipse(pDisc.x, pDisc.y, 10 * pDisc.scale, 70 * pDisc.scale, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = "#fff"; ctx.stroke();
            if(explode > 20) { ctx.fillStyle = "#brand-gold"; ctx.fillText("2. Disc", pDisc.x, pDisc.y - 80); }

            // 3. 캘리퍼 (디스크를 감쌈)
            const pCaliper = project3D(gap3, -0.6, -0.4, currentAngle); // 위치 살짝 위쪽
            ctx.fillStyle = "#ff4444"; // 빨간색
            ctx.beginPath();
            ctx.roundRect(pCaliper.x - 15, pCaliper.y - 30, 40 * pCaliper.scale, 60 * pCaliper.scale, 5);
            ctx.fill();
            if(explode > 20) ctx.fillText("3. Caliper", pCaliper.x, pCaliper.y - 40);

            // 4. 휠 & 타이어 (가장 바깥쪽)
            const pWheel = project3D(0.3 + gap4, 0, 0, currentAngle);
            
            // 타이어 (검은색)
            ctx.fillStyle = "#222";
            ctx.beginPath();
            ctx.ellipse(pWheel.x, pWheel.y, 25 * pWheel.scale, 85 * pWheel.scale, 0, 0, Math.PI*2);
            ctx.fill();
            
            // 휠 (회색)
            ctx.fillStyle = "#444";
            ctx.beginPath();
            ctx.ellipse(pWheel.x, pWheel.y, 15 * pWheel.scale, 50 * pWheel.scale, 0, 0, Math.PI*2);
            ctx.fill();

            if(explode < 10) {
                ctx.fillStyle = "#fff"; 
                ctx.fillText("Assembled", pWheel.x - 20, pWheel.y + 100);
            } else {
                ctx.fillStyle = "#fff";
                ctx.fillText("4. Wheel", pWheel.x, pWheel.y + 100);
            }

            // 연결선 (분해되었을 때 어디로 조립되는지 보여줌)
            if(explode > 10) {
                ctx.strokeStyle = "rgba(255, 204, 0, 0.5)";
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(pKnuckle.x, pKnuckle.y);
                ctx.lineTo(pWheel.x, pWheel.y);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            requestAnimationFrame(drawAssembly);
        }
        drawAssembly();

    </script>
</body>
</html>
